name: MAN7 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "security/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: man7-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: TypeScript validation
        run: npm run lint
      - name: Bash syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find offline-depot/scripts -type f -name '*.sh' -print0)
