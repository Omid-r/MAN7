name: MAN7 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "security/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: man7-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: TypeScript validation
        run: npm run lint
      - name: Remote SSH agent Python syntax validation
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('remote-agent/man7-remote-agent').read_text())"
      - name: Bash syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find offline-depot/scripts -type f -name '*.sh' -print0)
