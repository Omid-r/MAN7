    <script>
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        function MockViteSocket(url, protocols) {
          this.url = String(url || '');
          this.protocol = Array.isArray(protocols) ? (protocols[0] || '') : (protocols || '');
          this.readyState = 1; // OPEN
          this.bufferedAmount = 0;
          this.extensions = '';
          this.binaryType = 'blob';
          this.onopen = null;
          this.onerror = null;
          this.onclose = null;
          this.onmessage = null;
        }
        MockViteSocket.prototype.send = function () {};
        MockViteSocket.prototype.close = function () { this.readyState = 3; };
        MockViteSocket.prototype.addEventListener = function () {};
        MockViteSocket.prototype.removeEventListener = function () {};
        MockViteSocket.prototype.dispatchEvent = function () { return true; };
        var WrappedWebSocket = function (url, protocols) {
          var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
          var urlStr = String(url || '');
          if (protoStr.indexOf('vite-') !== -1 || urlStr.indexOf('token=') !== -1 || urlStr.indexOf('__vite') !== -1) {
            return new MockViteSocket(url, protocols);
          }
          return protocols !== undefined ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
        };
        WrappedWebSocket.prototype = NativeWebSocket.prototype;
        WrappedWebSocket.CONNECTING = 0;
        WrappedWebSocket.OPEN = 1;
        WrappedWebSocket.CLOSING = 2;
        WrappedWebSocket.CLOSED = 3;
        window.WebSocket = WrappedWebSocket;
      })();
    </script>
